<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | CraveNest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: linear-gradient(135deg, #FFF5F2 0%, #F1F5F9 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header Mini -->
  <header style="padding: 20px 0;">
    <div class="container flex-between">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fas fa-fire-flame-curved"></i></div>
        <div class="brand-name">Crave<span>Nest</span></div>
      </a>
      <a href="index.html" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary);">
        <i class="fas fa-arrow-left" style="margin-right: 6px;"></i> Back to Home
      </a>
    </div>
  </header>

  <!-- Auth Card Center -->
  <main class="container flex-center" style="flex: 1; padding: 40px 20px;">
    <div style="background: white; border-radius: var(--radius-xl); border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); max-width: 440px; width: 100%; padding: 36px 32px;">
      <!-- Title -->
      <div style="text-align: center; margin-bottom: 28px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 6px;">Welcome Back</h1>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">Sign in to your CraveNest account to continue</p>
      </div>

      <!-- Quick Demo Login Buttons -->
      <div style="background: var(--bg-subtle); border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 14px; margin-bottom: 24px; text-align: center;">
        <div style="font-size: 0.78rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;">
          ⚡ 1-Click Demo Credentials
        </div>
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button type="button" id="demo-user-btn" class="btn-secondary" style="padding: 7px 14px; font-size: 0.8rem; font-weight: 700; background: white;">
            <i class="fas fa-user"></i> Demo User
          </button>
          <button type="button" id="demo-admin-btn" class="btn-secondary" style="padding: 7px 14px; font-size: 0.8rem; font-weight: 700; background: white; color: var(--primary); border-color: #FED7AA;">
            <i class="fas fa-shield-alt"></i> Demo Admin
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" style="display: flex; flex-direction: column; gap: 18px;">
        <div>
          <label for="login-email" style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary); display: block; margin-bottom: 6px;">Email Address</label>
          <div style="position: relative;">
            <i class="far fa-envelope" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
            <input type="email" id="login-email" required placeholder="user@example.com" style="width: 100%; padding: 12px 14px 12px 40px; border-radius: var(--radius-md); font-size: 0.92rem;">
          </div>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="login-password" style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">Password</label>
            <a href="#" style="font-size: 0.78rem; color: var(--primary); font-weight: 600;">Forgot Password?</a>
          </div>
          <div style="position: relative;">
            <i class="fas fa-lock" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
            <input type="password" id="login-password" required placeholder="••••••••" style="width: 100%; padding: 12px 14px 12px 40px; border-radius: var(--radius-md); font-size: 0.92rem;">
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 13px; font-size: 0.95rem; border-radius: var(--radius-md); margin-top: 6px;">
          Sign In to CraveNest
        </button>
      </form>

      <!-- Switch to Register -->
      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
        Don't have an account yet? 
        <a href="register.html" style="color: var(--primary); font-weight: 700;">Create Account</a>
      </div>
    </div>
  </main>

  <footer style="text-align: center; padding: 20px; font-size: 0.82rem; color: var(--text-muted);">
    © 2026 CraveNest. Secure Token-Based Authentication.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
